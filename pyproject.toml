[project]
name = "comvis-image-rotation"
version = "0.1.0"
description = "Computer Vision Image Processing - Geometry Detection, Morphology, Fetal BPD/GA"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "opencv-contrib-python>=4.8.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
]

[tool.uv]
package = false

[project.scripts]
comvis-image-rotation = "comvis_image_rotation:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
